<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌟 ブロックくずし 🌟</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: linear-gradient(160deg, #ffe0f0 0%, #fff0c0 50%, #d0f0ff 100%);
    font-family: 'Nunito', 'Rounded Mplus 1c', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  /* floating stars background */
  .star {
    position: fixed;
    font-size: 1.4rem;
    animation: floatStar linear infinite;
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes floatStar {
    0%   { transform: translateY(110vh) rotate(0deg); opacity:0; }
    10%  { opacity: 0.5; }
    90%  { opacity: 0.5; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity:0; }
  }

  h1 {
    font-size: clamp(1.8rem, 6vw, 3rem);
    font-weight: 900;
    color: #ff5599;
    text-shadow: 3px 3px 0 #ffaacc, 0 0 20px rgba(255,100,150,0.3);
    letter-spacing: 0.05em;
    margin-bottom: 0.3em;
    position: relative;
    z-index: 1;
    animation: titleBounce 2s ease-in-out infinite;
  }
  @keyframes titleBounce {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  .hud {
    display: flex;
    gap: 1.5em;
    margin-bottom: 0.7em;
    font-size: clamp(1rem, 3vw, 1.3rem);
    font-weight: 900;
    position: relative;
    z-index: 1;
  }
  .hud-box {
    background: rgba(255,255,255,0.7);
    border-radius: 20px;
    padding: 0.3em 1em;
    box-shadow: 0 4px 0 rgba(0,0,0,0.08);
    color: #444;
  }
  .hud-box span { color: #ff5599; font-size: 1.2em; }

  .wrap {
    position: relative;
    z-index: 1;
  }

  #gameCanvas {
    display: block;
    border-radius: 24px;
    box-shadow: 0 8px 32px rgba(255,100,150,0.18), 0 2px 8px rgba(0,0,0,0.08);
    background: #fff8ff;
    border: 4px solid #ffbbdd;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(255,240,255,0.88);
    border-radius: 20px;
    z-index: 10;
    gap: 0.5em;
  }

  #overlay .emo { font-size: clamp(2.5rem, 8vw, 4rem); animation: emoBounce 0.6s ease-in-out infinite alternate; }
  @keyframes emoBounce { from { transform: scale(1); } to { transform: scale(1.15); } }

  #overlay h2 {
    font-size: clamp(1.4rem, 5vw, 2.2rem);
    font-weight: 900;
    color: #ff5599;
    text-shadow: 2px 2px 0 #ffaacc;
    text-align: center;
  }
  #overlay p {
    font-size: clamp(0.85rem, 2.5vw, 1.1rem);
    color: #888;
    font-weight: 700;
    text-align: center;
  }

  #startBtn {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(1rem, 3vw, 1.4rem);
    font-weight: 900;
    padding: 0.6em 2.2em;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #ff88bb, #ff5599);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 0 #cc3377, 0 8px 20px rgba(255,85,153,0.3);
    transition: transform 0.1s, box-shadow 0.1s;
    margin-top: 0.4em;
    letter-spacing: 0.05em;
  }
  #startBtn:hover { transform: translateY(2px); box-shadow: 0 4px 0 #cc3377, 0 6px 14px rgba(255,85,153,0.3); }
  #startBtn:active { transform: translateY(5px); box-shadow: 0 1px 0 #cc3377; }

  .tip {
    margin-top: 0.8em;
    font-size: 0.85rem;
    color: #cc88aa;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  /* Score pop */
  .score-pop {
    position: absolute;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 1.4rem;
    color: #ff5599;
    text-shadow: 1px 1px 0 #fff;
    pointer-events: none;
    animation: scorePop 0.8s ease-out forwards;
    z-index: 20;
  }
  @keyframes scorePop {
    0%   { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-50px) scale(1.4); opacity: 0; }
  }
</style>
</head>
<body>

<h1>🌈 ブロックくずし 🌈</h1>
<div class="hud">
  <div class="hud-box">⭐ <span id="scoreVal">0</span></div>
  <div class="hud-box">❤️ <span id="livesVal">5</span></div>
  <div class="hud-box">🎯 <span id="levelVal">1</span></div>
</div>

<div class="wrap">
  <canvas id="gameCanvas" width="480" height="500"></canvas>
  <div id="overlay">
    <div class="emo" id="overlayEmo">🌟</div>
    <h2 id="overlayTitle">ブロックくずし！</h2>
    <p id="overlayMsg">マウスかゆびでパドルをうごかそう！</p>
    <button id="startBtn">▶ はじめる！</button>
  </div>
</div>
<div class="tip">🖱️ マウス ／ ← → キー ／ 📱 タッチでパドルをうごかそう</div>

<script>
// --- Floating background stars ---
const EMOJIS = ['⭐','🌸','🎈','🍭','🦋','🌈','🎀','🍬'];
for (let i = 0; i < 14; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.textContent = EMOJIS[i % EMOJIS.length];
  s.style.left = Math.random() * 100 + 'vw';
  s.style.fontSize = (1 + Math.random() * 1.2) + 'rem';
  s.style.animationDuration = (8 + Math.random() * 14) + 's';
  s.style.animationDelay = (-Math.random() * 14) + 's';
  document.body.appendChild(s);
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const overlayEmo = document.getElementById('overlayEmo');
const overlayTitle = document.getElementById('overlayTitle');
const overlayMsg = document.getElementById('overlayMsg');
const startBtn = document.getElementById('startBtn');
const scoreEl = document.getElementById('scoreVal');
const livesEl = document.getElementById('livesVal');
const levelEl = document.getElementById('levelVal');

const W = canvas.width, H = canvas.height;

// --- State ---
let score = 0, lives = 5, level = 1, running = false, animId = null;

// --- Brick config ---
const COLS = 7, ROWS = 4;
const BRICK_W = 54, BRICK_H = 22, BRICK_GAP = 6;
const BRICK_OFF_X = (W - (COLS * (BRICK_W + BRICK_GAP) - BRICK_GAP)) / 2;
const BRICK_OFF_Y = 55;

// Fun emoji for each brick face
const BRICK_EMOJIS = [
  ['🍓','🍒','🍎'], // row0
  ['🍊','🍋','🍑'], // row1
  ['🍏','🥝','🍀'], // row2
  ['💙','💜','💖'], // row3
];
const BRICK_COLORS = [
  ['#ffb3c1','#ff6b8a'],
  ['#ffd9a0','#ffaa44'],
  ['#b8f0a0','#66cc44'],
  ['#b3d9ff','#55aaff'],
];

// --- Paddle ---
const paddle = { w: 100, h: 14, x: 0, y: H - 40, speed: 0 };
paddle.x = (W - paddle.w) / 2;

// --- Ball (slow & big for kids) ---
let ball = {};
function resetBall() {
  ball = { x: W/2, y: H - 70, r: 10, dx: 0, dy: 0 };
  const baseSpeed = 2.8 + (level - 1) * 0.25;
  ball.dx = (Math.random() > 0.5 ? 1 : -1) * baseSpeed;
  ball.dy = -baseSpeed * 1.05;
}

// --- Bricks ---
let bricks = [];
function initBricks() {
  bricks = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const emoList = BRICK_EMOJIS[r];
      bricks.push({
        x: BRICK_OFF_X + c * (BRICK_W + BRICK_GAP),
        y: BRICK_OFF_Y + r * (BRICK_H + BRICK_GAP),
        w: BRICK_W, h: BRICK_H,
        color: BRICK_COLORS[r],
        emoji: emoList[c % emoList.length],
        alive: true,
        scale: 1,      // pop animation
        wobble: 0,
      });
    }
  }
}

// --- Particles ---
let particles = [];
function spawnParticles(x, y, emoji) {
  for (let i = 0; i < 7; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = 2 + Math.random() * 3.5;
    particles.push({
      x, y,
      dx: Math.cos(angle) * spd,
      dy: Math.sin(angle) * spd - 2,
      life: 1,
      emoji,
      size: 14 + Math.random() * 10,
    });
  }
}

// --- Score popups ---
let scorePops = [];
function addScorePop(x, y, val) {
  const div = document.createElement('div');
  div.className = 'score-pop';
  div.textContent = '+' + val;
  const rect = canvas.getBoundingClientRect();
  const scaleX = rect.width / W, scaleY = rect.height / H;
  div.style.left = (rect.left + x * scaleX) + 'px';
  div.style.top  = (rect.top  + y * scaleY) + 'px';
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 820);
}

// --- Input ---
const keys = {};
document.addEventListener('keydown', e => { keys[e.key] = true; });
document.addEventListener('keyup',   e => { keys[e.key] = false; });

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w / 2));
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = (e.touches[0].clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w / 2));
}, { passive: false });

// --- Draw ---
function drawBackground() {
  // soft polka dots
  ctx.save();
  for (let i = 0; i < 5; i++) {
    for (let j = 0; j < 5; j++) {
      ctx.beginPath();
      ctx.arc(48 + i * 100, 48 + j * 100, 18, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,180,210,0.08)';
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawPaddle() {
  ctx.save();
  const grd = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
  grd.addColorStop(0, '#ff99cc');
  grd.addColorStop(1, '#ff5599');
  ctx.fillStyle = grd;
  ctx.shadowColor = '#ff88bb';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 8);
  ctx.fill();
  // shine
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.roundRect(paddle.x + 8, paddle.y + 3, paddle.w - 16, 4, 3);
  ctx.fill();
  ctx.restore();
}

function drawBall() {
  ctx.save();
  // shadow
  ctx.beginPath();
  ctx.ellipse(ball.x, ball.y + ball.r - 1, ball.r * 0.85, ball.r * 0.35, 0, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,100,150,0.18)';
  ctx.fill();
  // ball
  const grd = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 1, ball.x, ball.y, ball.r);
  grd.addColorStop(0, '#ffffff');
  grd.addColorStop(0.5, '#ffccdd');
  grd.addColorStop(1, '#ff88aa');
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
  ctx.fillStyle = grd;
  ctx.shadowColor = '#ff88aa';
  ctx.shadowBlur = 14;
  ctx.fill();
  // star face
  ctx.font = `${ball.r * 1.3}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowBlur = 0;
  ctx.fillText('⭐', ball.x, ball.y);
  ctx.restore();
}

function drawBricks() {
  for (const b of bricks) {
    if (!b.alive) continue;
    ctx.save();
    const cx = b.x + b.w/2, cy = b.y + b.h/2;
    ctx.translate(cx, cy);
    ctx.scale(b.scale, b.scale);
    if (b.wobble) ctx.rotate(Math.sin(b.wobble) * 0.08);
    ctx.translate(-b.w/2, -b.h/2);

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.07)';
    ctx.beginPath();
    ctx.roundRect(2, 4, b.w, b.h, 10);
    ctx.fill();

    // brick body
    const grd = ctx.createLinearGradient(0, 0, 0, b.h);
    grd.addColorStop(0, b.color[0]);
    grd.addColorStop(1, b.color[1]);
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.roundRect(0, 0, b.w, b.h, 10);
    ctx.fill();

    // shine
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.roundRect(6, 3, b.w - 12, 6, 4);
    ctx.fill();

    // emoji
    ctx.font = `${b.h * 0.82}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.emoji, b.w/2, b.h/2 + 1);

    ctx.restore();
  }
}

function drawParticles() {
  ctx.save();
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.font = p.size + 'px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.emoji, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// --- Collision ---
function brickCollision() {
  for (const b of bricks) {
    if (!b.alive) continue;
    if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
        ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
      b.alive = false;
      const pts = (ROWS - Math.floor((b.y - BRICK_OFF_Y) / (BRICK_H + BRICK_GAP))) * 10;
      score += pts;
      scoreEl.textContent = score;
      spawnParticles(b.x + b.w/2, b.y + b.h/2, b.emoji);
      addScorePop(b.x + b.w/2, b.y, pts);

      const oL = ball.x + ball.r - b.x;
      const oR = b.x + b.w - (ball.x - ball.r);
      const oT = ball.y + ball.r - b.y;
      const oB = b.y + b.h - (ball.y - ball.r);
      if (Math.min(oL, oR) < Math.min(oT, oB)) ball.dx = -ball.dx;
      else ball.dy = -ball.dy;
      break;
    }
  }
}

// --- Update ---
function update() {
  if (keys['ArrowLeft']  || keys['a']) paddle.x = Math.max(0, paddle.x - 7);
  if (keys['ArrowRight'] || keys['d']) paddle.x = Math.min(W - paddle.w, paddle.x + 7);

  ball.x += ball.dx;
  ball.y += ball.dy;

  if (ball.x - ball.r < 0)  { ball.x = ball.r; ball.dx =  Math.abs(ball.dx); }
  if (ball.x + ball.r > W)  { ball.x = W - ball.r; ball.dx = -Math.abs(ball.dx); }
  if (ball.y - ball.r < 0)  { ball.y = ball.r; ball.dy =  Math.abs(ball.dy); }

  // Paddle hit
  if (ball.y + ball.r >= paddle.y &&
      ball.y + ball.r <= paddle.y + paddle.h + 8 &&
      ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r &&
      ball.dy > 0) {
    const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
    ball.dx = hit * 4.5;
    ball.dy = -Math.abs(ball.dy);
    ball.y = paddle.y - ball.r;
    // keep speed sane
    const spd = Math.hypot(ball.dx, ball.dy);
    const max = 6;
    if (spd > max) { ball.dx *= max/spd; ball.dy *= max/spd; }
  }

  // Miss
  if (ball.y - ball.r > H) {
    lives--;
    livesEl.textContent = lives;
    if (lives <= 0) return endGame();
    resetBall();
    showOverlay('💦 もう一回！', `のこり ❤️ ${lives}`, 'つづける');
    return;
  }

  brickCollision();

  // Brick wobble tick
  for (const b of bricks) {
    if (b.wobble > 0) b.wobble += 0.5;
    if (b.wobble > Math.PI * 4) b.wobble = 0;
  }

  // Particles
  for (const p of particles) {
    p.x += p.dx; p.y += p.dy;
    p.dy += 0.15;
    p.life -= 0.025;
  }
  particles = particles.filter(p => p.life > 0);

  // Level clear
  if (bricks.every(b => !b.alive)) {
    level++;
    levelEl.textContent = level;
    initBricks();
    resetBall();
    showOverlay('🎉 やったー！', 'つぎのステージ！', 'つぎへ！');
    return;
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBackground();
  drawBricks();
  drawParticles();
  drawPaddle();
  drawBall();
}

function loop() {
  update();
  draw();
  animId = requestAnimationFrame(loop);
}

function startGame() {
  score = 0; lives = 5; level = 1;
  scoreEl.textContent = 0;
  livesEl.textContent = 5;
  levelEl.textContent = 1;
  particles = [];
  initBricks();
  resetBall();
  hideOverlay();
  if (animId) cancelAnimationFrame(animId);
  loop();
}

function hideOverlay() { overlay.style.display = 'none'; }

function showOverlay(title, msg, btn, emoji) {
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  overlayEmo.textContent = emoji || '🌟';
  overlayTitle.textContent = title;
  overlayMsg.textContent = msg;
  startBtn.textContent = btn;
  overlay.style.display = 'flex';
}

function endGame() {
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  showOverlay('😢 ゲームオーバー', `⭐ スコア: ${score}`, 'もう一度！', '😢');
  startBtn.onclick = startGame;
}

startBtn.onclick = startGame;

// Initial overlay tweak
overlayEmo.textContent = '🌈';
</script>
</body>
</html>
